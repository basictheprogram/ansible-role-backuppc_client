---
- name: Reload sshd
  ansible.builtin.service:
    name: ssh
    state: reloaded
  tags: backuippc_client

- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
  tags: backuippc_client

- name: Delete tempdir
  ansible.builtin.file:
    path: "{{ known_hosts.path }}"
    state: absent
  when: known_hosts.path is defined
  tags: backuippc_client
