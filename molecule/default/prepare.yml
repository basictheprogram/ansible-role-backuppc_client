---
- name: Prepare molecule tests
  hosts: all
  become: true

  vars:
    prepare_packages:
      - dialog
      - less
      - vim-tiny

  environment:
      TZ: "America/Chicago" # Keep tzdata pacakge happy
      DEBIAN_FRONTEND: "noninteractive"

  pre_tasks:

  roles:

  tasks:
    - name: PREPARE update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600
        force_apt_get: true
        autoremove: true
        autoclean: true
      changed_when: false
      when: ansible_os_family == 'Debian'

    - name: PREPARE install packages
      apt:
        name: "{{ prepare_packages }}"
        state: present
        install_recommends: no
        force_apt_get: yes