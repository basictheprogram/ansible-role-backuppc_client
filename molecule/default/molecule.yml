---
dependency:
  name: Galaxy
driver:
  name: Docker
platforms:
  - name: backuppc-client-molecule-jammy-instance
    image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    pre_build_image: true
  - name: backuppc-client-molecule-noble-instance
    image: "geerlingguy/docker-ubuntu2404-ansible:latest"
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    pre_build_image: true
  - name: backuppc-client-molecule-resolute-instance
    image: "geerlingguy/docker-ubuntu2604-ansible:latest"
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    pre_build_image: true
  - name: backuppc-client-molecule-bookworm-instance
    image: "geerlingguy/docker-debian12-ansible:latest"
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    pre_build_image: true
  - name: backuppc-client-molecule-trixie-instance
    image: "geerlingguy/docker-debian13-ansible:latest"
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    pre_build_image: true
  - name: backuppc-client-molecule-rockylinux8-instance
    image: "geerlingguy/docker-rockylinux8-ansible:latest"
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    pre_build_image: true
  - name: backuppc-client-molecule-rockylinux9-instance
    image: "geerlingguy/docker-rockylinux9-ansible:latest"
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    pre_build_image: true
provisioner:
  name: Ansible
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
verifier:
  name: testinfra
  directory: tests/
  options:
    v: true
    p: "no:cacheprovider"
