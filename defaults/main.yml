---
backuppc_client_ssh_pubkey_accepted_types: "+ssh-rsa"

# Path the rsyncbackup-wrapper.sh forced command is deployed to, and
# that authorized_keys' command= restriction points at. The wrapper
# validates $SSH_ORIGINAL_COMMAND is actually "rsync --server --sender
# ..." and re-execs it, rather than a hand-frozen rsync command string
# baked into command= itself - see tasks/ssh_keys.yml. rsync flags and
# excludes belong in the BackupPC server's config.pl (RsyncArgs /
# RsyncArgsExtra), not here.
backuppc_client_wrapper_path: /usr/local/bin/rsyncbackup-wrapper.sh

# tasks/known_hosts.yml (only runs when backuppc_ssh_key_scan is
# defined) ssh-keyscans this client and records it in the BackupPC
# server's known_hosts, delegated to backuppc_client_known_hosts_server.
# That variable has no default -- it's required whenever
# backuppc_ssh_key_scan is set (see tasks/preflight.yml).
backuppc_client_known_hosts_remote_user: ansible
backuppc_client_known_hosts_owner: backuppc
backuppc_client_known_hosts_group: backuppc
