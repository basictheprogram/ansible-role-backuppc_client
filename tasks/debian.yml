---
- name: Debian install backuppc client packages (apt)
  ansible.builtin.apt:
    name: "{{ backuppc_client_packages }}"
    state: "present"
    install_recommends: false
    force_apt_get: true
  tags: backuppc_client

- name: Debian dump mysql databases
  ansible.builtin.include_tasks: mysql_dump.yml
  when:
    - mysql_dump_script is defined
  tags: backuppc_client

- name: Debian dump postgres databases
  ansible.builtin.include_tasks: postgres_dump.yml
  when:
    - postgres_dump_script is defined
  tags: backuppc_client

# - name: Debug common_library
#   ansible.builtin.debug:
#     msg: "common_library: {{ common_library }}"
#   tags: backuppc_client

- name: Debian major_release >= 10
  when:
    - ansible_lsb.major_release|int >= 10
    - ansible_distribution == "Debian"
  block:
    - name: Debian (>=10) configure /etc/sudoers.d
      ansible.builtin.include_tasks: sudoers_d.yml
  tags: backuppc_client

