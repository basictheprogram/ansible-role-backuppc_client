# Debian release 10 and newer have /etc/sudoer.d/
#
- name: add backuppc user to sudoers.d
  copy:
    content: |
      {{ item.username }} ALL=NOPASSWD:/usr/bin/rsync

    dest: "/etc/sudoers.d/{{ item.username }}"
    mode: "0440"
  with_items:
    - "{{ backuppc_client }}"
  when:
    - ansible_distribution != 'Ubuntu'
    - ansible_lsb.major_release|int >= 10
  tags: backuppc

- name: copy MySQL dump script
  copy:
    src: dump_mysql.sh
    dest: "{{ mysql_dump_script }}"
    mode: "0750"
  when:
    - mysql_dump_script is defined
  tags: backuppc

- name: create /root/.config
  file:
    path: /root/.config/
    state: directory
    owner: root
    group: root
    mode: 0750
  when:
    - mysql_dump_script is defined
  tags: backuppc

- name: touch dumpdb.sh.config
  file:
    path: /root/.config/dumpdb.sh.config
    state: touch
    owner: root
    group: root
    mode: 0640
  when:
    - mysql_dump_script is defined
  tags: backuppc
