---
- name: install backuppc client packages (apt)
  apt:
    name: "{{ backuppc_client_packages }}"
    state: "present"
    install_recommends: false
    force_apt_get: yes
  tags: backuppc

# Configuration specific to Ubuntu (but not Debian)
#
- name: check if ansible_distribution is Ubuntu
  include_tasks: ubuntu.yml
  when: ansible_distribution == 'Ubuntu'
  tags: backuppc

- name: accept ssh-dss key types
  lineinfile:
    dest: /etc/ssh/sshd_config
    state: present
    regexp: "^PubkeyAcceptedKeyTypes(.*)$"
    line: "PubkeyAcceptedKeyTypes +ssh-dss"
    validate: "sshd -T -f %s"
  when:
    - ansible_distribution != 'Ubuntu'
    - ansible_lsb.major_release|int >= 10
  notify:
    - restart sshd
  tags: backuppc

# Leave this task, I'm guessing we will need it when the backuppc
# server has an OS dist-upgrade
