---
# tasks file for roles/backuppc-client
- debug:
    msg: "{{ ansible_distribution_release }}:{{ ansible_distribution }}:{{ ansible_os_family }}"
  tags: backuppc

- name: group_names
  debug:
    msg: "{{ group_names }}"
  tags: backuppc

- name: gather OS specific variables
  include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution_release }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
        - "main.yml"
      paths:
        - "vars"
  tags: backuppc

- import_tasks: debian.yml
  when: ansible_os_family == 'Debian'

# Tasks after this comment (are hopefully) common to a linux bases operating
# systems?
#
- name: delete old backuppc users
  user:
    name: "{{ item.username }}"
    state: "absent"
    remove: "yes"
  with_items:
    - "{{ deprecated_backuppc_username }}"
  tags: backuppc

# Look in group_vars and host_vars for default value for {{ backuppc_client }}
#
- name: create backuppc user
  user:
    name: "{{ item.username }}"
    shell: "{{ item.shell }}"
    createhome: "yes"
    state: "present"
    home: "{{ item.home }}"
    comment: "{{ item.comment }}"
    password: "*"
    password_lock: yes
    update_password: always
  with_items:
      - "{{ backuppc_client }}"
  changed_when: False
  tags: backuppc

- name: set up backuppc user authorized_keys
  authorized_key:
    user: "{{ item.0.username }}"
    state: "present"
    key_options: "{{ item.0.key_options }}"
    key: "{{ item.1 }}"
    manage_dir: "yes"
  with_subelements:
    - "{{ backuppc_client }}"
    - authorized_keys
  tags: backuppc

- name: set up backuppc user MySQL dump authorized_keys
  authorized_key:
    user: "{{ item.0.username }}"
    state: "present"
    key_options: "{{ item.0.key_options }}"
    key: "{{ item.1 }}"
    manage_dir: "yes"
  with_subelements:
    - "{{ backuppc_client_mysql_dump }}"
    - authorized_keys
  when:
    - backuppc_client_mysql_dump is defined
  tags: backuppc

# TODO: task to remove old/deprecated autheorized_keys?

- include_tasks: "{{ role_path }}/../lib/sudo-safety-backup.yml"
  tags: backuppc

- name: delete old backuppc user from sudoers (monolithic)
  lineinfile:
    dest: "/etc/sudoers.tmp"
    state: "absent"
    regexp: "^{{ item.username }}"
  with_items:
    - "{{ deprecated_backuppc_username }}"
  tags: backuppc

- include_tasks: "{{ role_path }}/../lib/sudo-safety-restore.yml"
  tags: backuppc

- name: delete old backuppc user from sudoers.d
  file:
    path: "/etc/sudoers.d/{{ item.username }}"
    state: absent
  with_items:
    - "{{ deprecated_backuppc_username }}"
  tags: backuppc

