---
# tasks file for roles/backuppc-client

#- import_tasks: redhat.yml
#  when: ansible_os_family == 'RedHat'

- name: gather OS specific variables
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution_release }}.yml"
    - "{{ ansible_distribution }}.yml"
    - "{{ ansible_os_family }}.yml"
  tags: 
    - backuppc
    - backuppc2
    
- name: personal variables
  include_vars: "{{ lookup('env','HOME') }}/.ansible/{{ role_name }}.yml"
  ignore_errors: yes
  tags: backuppc

- import_tasks: debian.yml
  when: ansible_os_family == 'Debian'

#- import_tasks: suse.yml
#  when: ansible_os_family == 'Suse' or ansible_os_family == 'openSUSE'

- name: delete old backuppc users
  user:
    name: "{{ item.username }}"
    state: "absent"
    remove: "yes"
  with_items:
    - "{{ deprecated_backuppc_username }}"
  tags: backuppc

# look in group_vars and host_vars for default value for {{ backuppc_client }}
#
- name: create backuppc user
  user:
    name: "{{ item.username }}"
    shell: "{{ item.shell }}"
    createhome: "yes"
    state: "present"
    home: "{{ item.home }}"
    comment: "{{ item.comment }}"
    password: "*"
  with_items:
      - "{{ backuppc_client }}"
  tags: backuppc

- name: lock backuppc user account
  command: "/usr/bin/passwd -l {{ item.username }}"
  register: result
  failed_when: result.rc != 0
  changed_when: false
  with_items:
      - "{{ backuppc_client }}"
  tags: backuppc

- debug:
    msg: "{{ item.username }}{{ item.authorized_keys }}"
  with_items:
    - "{{ backuppc_client }}"
  tags: backuppc2

- name: set up backuppc user authorized_keys
  authorized_key:
    user: "{{ item.username }}"
    state: "present"
    key_options: "{{ item.key_options }}"
    key: "{{ item.authorized_keys }}"
    manage_dir: "yes"
  with_items:
      - "{{ backuppc_client }}"
  tags: backuppc

- import_tasks: "../lib/sudo-safety-backup.yml"
  tags: backuppc
    
- name: add backuppc user to sudoers
  lineinfile:
    dest: "/etc/sudoers.tmp"
    state: "present"
    regexp: "^{{ item.username }}"
    line: "{{ item.username }} ALL=NOPASSWD:/usr/bin/rsync"
  with_items:
    - "{{ backuppc_client }}"
  tags: backuppc

- import_tasks: "../lib/sudo-safety-restore.yml"
  tags: backuppc

- import_tasks: "../lib/sudo-safety-backup.yml"
  tags: backuppc

- name: delete old backuppc user from sudoers
  lineinfile:
    dest: "/etc/sudoers.tmp"
    state: "absent"
    regexp: "^{{ item.username }}"
  with_items:
    - "{{ deprecated_backuppc_username }}"
  tags: backuppc  

- import_tasks: "../lib/sudo-safety-restore.yml"
  tags: backuppc  

# Can override the location "{{ known_host_keys_dir }}" 
# default is in defaults/main.yml
#
- name: fetch ssh public keys
  fetch:
    src: "/etc/ssh/{{ item }}"
    dest: "{{ known_host_keys_dir }}/known_host_keys"
  with_items:
      - "{{ ssh_host_pub_keys }}"  
  ignore_errors: yes
  register: ssh_host_keys
  tags: 
    - backuppc
    - backuppc2

- debug:
    msg: "{{ ansible_fqdn }} {{ lookup('file', item.dest).split(' ')[0:-1] | join(' ') }}"
  with_items:
    - "{{ ssh_host_keys.results }}"
  tags:
    - backuppc

- name: add ssh host key to backuppc known_hosts
  known_hosts:
    path: /etc/ssh/ssh_known_hosts
    name: "{{ ansible_fqdn }}"
    key: "{{ ansible_fqdn }} {{ lookup('file', item.dest).split(' ')[0:-1] | join(' ') }}"
    state: present
  with_items:
    - "{{ ssh_host_keys.results }}"
  delegate_to: backuppc.castle.real-time.com
#  delegate_to: "{{ backuppc_server_hostname }}"
  remote_user: ansible
#  when: backuppc_server_hostname is defined
  tags: 
    - backuppc
    - backuppc2

- name: remove ssh host key on the backuppc known_hosts
  known_hosts:
    path: /etc/ssh/ssh_known_hosts
    name: "{{ ansible_fqdn }}"
    state: absent
  with_items:
    - "{{ backuppc_server.deprecated_users }}"
  delegate_to: backuppc.castle.real-time.com
#  delegate_to: "{{ backuppc_server_hostname }}"
  remote_user: ansible
  when: 
     - backuppc_server is defined
  tags: backuppc
