---
- name: release, distribution, family
  ansible.builtin.debug:
    msg: "{{ ansible_distribution_release }}:{{ ansible_distribution }}:{{ ansible_os_family }}"
  tags: backuppc_client

- name: group_names
  ansible.builtin.debug:
    msg: "{{ group_names }}"
  tags: backuppc_client

- name: gather OS specific variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution_release }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
        - "default.yml"
      paths:
        - "vars"
  tags: backuppc_client

- name: import_tasks debian.yml
  import_tasks: debian.yml
  when: ansible_os_family == 'Debian'

# Tasks after this comment (are hopefully) common to a linux bases operating
# systems?
#
- name: delete old backuppc users
  ansible.builtin.user:
    name: "{{ backuppc_client_item.username }}"
    state: "absent"
    remove: true
  loop:
    "{{ deprecated_backuppc_username }}"
  loop_control:
    loop_var: backuppc_client_item
  tags: backuppc_client

# Look in group_vars and host_vars for default value for {{ backuppc_client }}
#
- name: create backuppc user    # noqa no-log-password
  ansible.builtin.user:
    name: "{{ backuppc_client_item.username }}"
    shell: "{{ backuppc_client_item.shell }}"
    createhome: true
    state: "present"
    home: "{{ backuppc_client_item.home }}"
    comment: "{{ backuppc_client_item.comment }}"
    password: "*"
    password_lock: true
    update_password: always
  loop:
    "{{ backuppc_client }}"
  loop_control:
    loop_var: backuppc_client_item
  changed_when: false
  tags: backuppc_client

- name: set up backuppc user authorized_keys
  ansible.posix.authorized_key:
    user: "{{ backuppc_client_item.0.username }}"
    state: "present"
    key_options: "{{ backuppc_client_item.0.key_options }}"
    key: "{{ backuppc_client_item.1 }}"
    manage_dir: true
  loop: "{{ backuppc_client | subelements('authorized_keys') }}"
  loop_control:
    loop_var: backuppc_client_item
  tags: backuppc_client

- name: set up backuppc user MySQL dump authorized_keys
  ansible.posix.authorized_key:
    user: "{{ backuppc_client_item.0.username }}"
    state: "present"
    key_options: "{{ backuppc_client_item.0.key_options }}"
    key: "{{ backuppc_client_item.1 }}"
    manage_dir: true
  # loop: "{{ backuppc_client_mysql_dump|subelements('authorized_keys', 'skip_missing=True') }}"
  loop: "{{ lookup('subelements', backuppc_client_mysql_dump, 'authorized_keys', errors='ignore') }}"
  loop_control:
    loop_var: backuppc_client_item
  when: backuppc_client_mysql_dump is defined
  tags: backuppc_client

# TODO: task to remove old/deprecated autheorized_keys?

- name: configure monolith /etc/sudoers file
  import_tasks: monolithic_sudoers.yml
  when:
    - ansible_lsb.major_release|int < 20
  tags: backuppc_client

- name: configure /etc/sudoers.d
  import_tasks: sudoers_d.yml
  when:
    - ansible_lsb.major_release|int >= 20
  tags: backuppc_client

