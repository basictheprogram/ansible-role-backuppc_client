---
# tasks file for roles/backuppc-client

#- include: redhat.yml
#  when: ansible_os_family == 'RedHat'
- include: debian.yml
  when: ansible_os_family == 'Debian'
- include: suse.yml
  when: ansible_os_family == 'Suse' or ansible_os_family == 'openSUSE'

- name: create backuppc user
  user:
    name: "{{ item.username }}"
    shell: "{{ item.shell }}"
    createhome: "yes"
    state: "present"
    home: "{{ item.home }}"
    comment: "{{ item.comment }}"
  with_items:
      - "{{ backuppc_client }}"
  tags: backuppc

- name: lock backuppc user account
  command: "/usr/bin/passwd -l {{ item.username }}"
  register: result
  failed_when: result.rc != 0
  changed_when: false
  with_items:
      - "{{ backuppc_client }}"
  tags: backuppc

- name: set up backuppc user authorized_keys
  authorized_key:
    user: "{{ item.username }}"
    state: "present"
    key_options: "{{ item.key_options }}"
    key: "{{ item.authorized_keys }}"
    manage_dir: "yes"
  with_items:
      - "{{ backuppc_client }}"
  tags: backuppc

- include: "../lib/sudo-safety-backup.yml"
  tags: backuppc
    
- name: add backuppc user to sudoers
  lineinfile:
    dest: "/etc/sudoers.tmp"
    state: "present"
    regexp: "^{{ item.username }}"
    line: "{{ item.username }} ALL=NOPASSWD:/usr/bin/rsync"
  with_items:
    - "{{ backuppc_client }}"
  tags: backuppc

- include: "../lib/sudo-safety-restore.yml"
  tags: backuppc

- name: delete old backuppc users
  user:
    name: "{{ item.username }}"
    state: "absent"
    remove: "yes"
  with_items:
    - "{{ deprecated_backuppc_username }}"
  tags: backuppc

- include: "../lib/sudo-safety-backup.yml"
  tags: backuppc

- name: delete old backuppc user from sudoers
  lineinfile:
    dest: "/etc/sudoers.tmp"
    state: "absent"
    regexp: "^{{ item.username }}"
  with_items:
    - "{{ deprecated_backuppc_username }}"
  tags: backuppc  

- include: "../lib/sudo-safety-restore.yml"
  tags: backuppc  
