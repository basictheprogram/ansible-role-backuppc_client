---
# tasks file for roles/backuppc-client

#- include: redhat.yml
#  when: ansible_os_family == 'RedHat'
- include: debian.yml
  when: ansible_os_family == 'Debian'

- debug: msg="{{ backuppc_client }}"

- name: create backuppc user
  user: >
    name="{{ item.username }}"
    shell="{{ item.shell }}"
    createhome="yes"
    state="present"
    home="{{ item.home }}"
    comment="{{ item.comment }}"
  with_items:
      - "{{ backuppc_client }}"
  tags: backuppc

- name: lock backuppc user account
  command: "/usr/bin/passwd -l {{ item.username }}"
  register: result
  failed_when: >
      result.rc != 0
  changed_when: >
      result.rc == 0 and ("Do not report change every time" in result.stderr)
  with_items:
      - "{{ backuppc_client }}"
  tags: backuppc
  
- name: set up authorized_keys
  authorized_key: >
    user="{{ item.username }}"
    state="present"
    key_options="{{ item.key_options }}"
    key="{{ item.authorized_keys|b64decode }}"
    manage_dir="yes"
  with_items:
      - "{{ backuppc_client }}"
  tags: backuppc
  
- name: copy sudoers file for safety
  command: "/bin/cp -f /etc/sudoers /etc/sudoers.tmp"
  register: result
  failed_when: >
      result.rc != 0
  changed_when: >
      result.rc == 0 and ("Do not report change every time" in result.stderr)
  tags: backuppc
  
- name: add backuppc user to sudoers
  lineinfile: >
      dest="/etc/sudoers.tmp"
      state="present"
      regexp="^{{ item.username }}"
      line="{{ item.username }} ALL=NOPASSWD:/usr/bin/rsync"
  with_items:
      - "{{ backuppc_client }}"
  tags: backuppc

- name: comment out Default requiretty in sudoers
  lineinfile: >
    dest="/etc/sudoers.tmp"
    state="present"
    backrefs="yes"
    regexp="^Defaults(\s)+requiretty$"
    line="#Defaults    requiretty"
  tags: backuppc
  
- name: final sudoers file check
  shell: "/usr/sbin/visudo -q -c -f /etc/sudoers.tmp && /bin/cp -f /etc/sudoers.tmp /etc/sudoers"
  failed_when: >
      result.rc != 0
  changed_when: >
      result.rc == 0 and ("Do not report change every time" in result.stderr)
  tags: backuppc
  