---
# tasks file for roles/backuppc-client

#- include: redhat.yml
#  when: ansible_os_family == 'RedHat'
- include: debian.yml
  when: ansible_os_family == 'Debian'

- name: create backuppc user
  user: >
    name="{{ backuppc_client.username }}"
    shell="{{ backuppc_client.shell }}"
    createhome="yes"
    state="present"
    home="{{ backuppc_client.home }}"
    comment="{{ backuppc_client.comment }}"
  tags: backuppc

- name: lock backuppc user account
  command: "/usr/bin/passwd -l {{ backuppc_client.username }}"
  register: result
  failed_when: >
      result.rc != 0
  changed_when: >
      result.rc == 0 and ("Do not report change every time" in result.stderr)
  tags: backuppc

- debug: msg='{{ backuppc_client.keys }}'
  tags: backuppc
  
- name: set up authorized_keys
  authorized_key: >
    user="{{ backuppc_client.username }}"
    state="present"
    key='{{ backuppc_client.key }}'             # MUST be single quote, bug in ansible http://bit.ly/1HwqpaL
  tags: backuppc
  
- name: copy sudoers file for safety
  command: "/bin/cp -f /etc/sudoers /etc/sudoers.tmp"
  failed_when: >
      result.rc != 0
  changed_when: >
      result.rc == 0 and ("Do not report change every time" in result.stderr)
  tags: backuppc
  
- name: add backuppc user to sudoers
  lineinfile: >
      dest="/etc/sudoers.tmp"
      state="present"
      regexp="^rsyncbackup"
      line="rsyncbackup ALL=NOPASSWD:/usr/bin/rsync"
  tags: backuppc

- name: comment out Default requiretty in sudoers
  lineinfile: >
    dest="/etc/sudoers.tmp"
    state="present"
    backrefs="yes"
    regexp="^Defaults(\s)+requiretty$"
    line="#Defaults    requiretty"
  tags: backuppc
  
- name: final sudoers file check
  shell: "/usr/sbin/visudo -q -c -f /etc/sudoers.tmp && /bin/cp -f /etc/sudoers.tmp /etc/sudoers"
  failed_when: >
      result.rc != 0
  changed_when: >
      result.rc == 0 and ("Do not report change every time" in result.stderr)
  tags: backuppc
