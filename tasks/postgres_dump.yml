---
- name: Set up backuppc user Postgres dump authorized_keys
  ansible.posix.authorized_key:
    user: "{{ backuppc_client_item.0.username }}"
    state: "present"
    key_options: "{{ backuppc_client_item.0.key_options }}"
    key: "{{ backuppc_client_item.1 }}"
    manage_dir: true
  loop: "{{ backuppc_client_postgres_dump | subelements('authorized_keys') }}"
  loop_control:
    loop_var: backuppc_client_item
  when: backuppc_client_postgres_dump is defined
  tags: backuppc_client

- name: Copy Postgres dump script
  ansible.builtin.copy:
    src: "{{ postgres_dump_file }}"
    dest: "{{ postgres_dump_script }}"
    mode: "0750"
  tags: backuppc_client
