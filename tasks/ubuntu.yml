---
- name: ubuntu major_release >= 20
  block:
    - name: configure openssh server (ubuntu 20.04+)
      ansible.builtin.copy:
        src: files/etc/ssh/sshd_config.d/
        dest: /etc/ssh/sshd_config.d
        owner: root
        group: root
        mode: "0400"
        validate: "sshd -T -f %s"
      notify:
        - reload sshd
      tags: backuppc_client
  when:
    - ansible_lsb.major_release|int >= 20

- name: ubuntu major_release >= 16 and major_release < 20
  block:
    - name: accept ssh-dss key types
      ansible.builtin.lineinfile:
        dest: /etc/ssh/sshd_config
        state: present
        regexp: "^PubkeyAcceptedKeyTypes(.*)$"
        line: "PubkeyAcceptedKeyTypes +ssh-dss"
        validate: "sshd -T -f %s"
      notify:
        - reload sshd
      tags: backuppc_client
  when:
    - ansible_lsb.major_release|int >= 16
    - ansible_lsb.major_release|int < 20

- name: ubuntu major_release < 16 or major_release >= 20
  block:
    # - name: UBUNTU remove ssh-dss key types
    #   ansible.builtin.lineinfile:
    #     dest: /etc/ssh/sshd_config
    #     state: absent
    #     regexp: "^PubkeyAcceptedKeyTypes(.*)$"
    #     validate: "sshd -T -f %s"
    #   notify:
    #     - reload sshd
    #   tags: backuppc_client

    - name: accept ssh-dss key types
      ansible.builtin.lineinfile:
        dest: /etc/ssh/sshd_config
        state: present
        regexp: "^PubkeyAcceptedKeyTypes(.*)$"
        line: "PubkeyAcceptedKeyTypes +ssh-dss"
        validate: "sshd -T -f %s"
      notify:
        - reload sshd
      tags: backuppc_client

  when:
      - ansible_lsb.major_release|int < 16 or ansible_lsb.major_release|int >= 20


- name: Unsupported release
  ansible.builtin.debug:
    msg: "Ubuntu {{ ansible_distribution_release }} is not supported"
  when:
    - ansible_lsb.major_release|int < 16
